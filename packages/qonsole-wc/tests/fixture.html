<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Qonsole test fixture</title>
  <script type="module" src="/src/index.js"></script>
</head>
<body>
  <epi-qonsole
    id="qonsole"
    endpoints='{"test endpoint": "https://example.org/sparql"}'
    prefixes='{
      "rdf":  "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
      "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
      "owl":  "http://www.w3.org/2002/07/owl#"
    }'
    queries='[
      {
        "name": "All classes",
        "query": "SELECT ?class ?label WHERE {\n  ?class a owl:Class .\n  OPTIONAL { ?class rdfs:label ?label }\n} LIMIT 10",
        "prefixes": ["owl", "rdfs"]
      },
      {
        "name": "Describe resource",
        "query": "DESCRIBE <http://example.org/resource>"
      },
      {
        "name": "Remote query",
        "queryURL": "/tests/remote-query.rq"
      }
    ]'
  ></epi-qonsole>
</body>
</html>
