name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write access to publish to the GitHub Packages registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://npm.pkg.github.com
      - run: yarn install --immutable
      - run: yarn workspace @epimorphics/qonsole build
      - run: yarn workspace @epimorphics/qonsole npm publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
