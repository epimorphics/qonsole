name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write access to publish to the GitHub Packages registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://npm.pkg.github.com
      # The release tag must name the version in package.json, and a prerelease
      # version (2.0.0-rc.1) is published under its own dist-tag (rc), so that
      # it is never what `yarn add @epimorphics/qonsole` installs by default
      - name: Check version and choose dist-tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/qonsole-wc/package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version v$version"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=${version#*-}; dist_tag=${prerelease%%.*} ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing $version with dist-tag $dist_tag"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - run: yarn install --immutable
      - run: yarn workspace @epimorphics/qonsole build
      - run: yarn workspace @epimorphics/qonsole npm publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
